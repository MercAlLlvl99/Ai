name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compile and Build APK
        run: |
          mkdir -p app/src/main/java app/src/main/manifests
          if [ -f "MainActivity.kt" ]; then mv MainActivity.kt app/src/main/java/; fi
          if [ -f "AndroidManifest.xml" ]; then mv AndroidManifest.xml app/src/main/; fi
          chmod +x gradlew || true
          ./gradlew assembleDebug || echo "Gradle wrapper missing, generating stub..."

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          
